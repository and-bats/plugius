:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; --mono:"Plugius Mono",ui-monospace,Menlo,monospace; --display:"Plugius Display","Arial Narrow",sans-serif;
  --bg:#E4E9ED; --panel:#F5F7F9; --ink:#1E272E; --bright:#12191F; --mute:#46535D; --line:#D5DCE2; --strong:#98A4AE;
  --card:#FFFFFF; --edge:#D5DCE2; --inset:#EFF3F6; --newcard:#F4EDFA; --newedge:#CDB3E6; --cardshadow:rgba(20,30,40,.1);
  --accent:#0F7355; --accent-ink:#fff; --ok:#0F6B4C; --new:#6A2BA0; --blue:#1A5C9E; --fmt:#B8322F; --track:#D5DCE2; --bar:#5F6E7A;
  --warn:#80500A; --bad:#A92A24; --chip:#EAEEF1; --hover:#D6ECFF; --shadow:rgba(20,30,40,.16);
  --head:#1D252C; --head-ink:#F1F4F7; --head-mute:#BCC7D0; --head-line:#3D4954; --steel:#5F6E7A;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12161A; --panel:#1A1F25; --ink:#DCE3E9; --bright:#F1F4F7; --mute:#A9B4BE; --line:#2A3138; --strong:#46515B;
  --card:#20262D; --edge:#2C343C; --inset:#191E23; --newcard:#2A2636; --newedge:#5D4A7E; --cardshadow:rgba(0,0,0,.4);
  --accent:#2BBF92; --accent-ink:#06211A; --ok:#6FE3BF; --new:#CDA6FF; --blue:#9CCBF5; --fmt:#FF8F85; --track:#2F373F; --bar:#AEBBC6;
  --warn:#F4C48F; --bad:#FF9D96; --chip:#232A31; --hover:#C9E4FB; --shadow:rgba(0,0,0,.4);
  --head:#12161A; --head-mute:#A9B4BE; --head-line:#3A444D; --steel:#AEBBC6;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
header{display:flex;flex-wrap:wrap;align-items:center;gap:16px 36px;padding:16px 28px;background:var(--head);color:var(--head-ink);border-bottom:1px solid var(--head-line)}
h1,.stats,.hr{min-height:64px}
h1{display:flex;align-items:center;gap:12px;margin:0;font:700 64px/.9 var(--display);letter-spacing:.015em;text-transform:uppercase}
/* Перша літера це та сама P зі шрифту, тому висота, товщина й відступ до L збігаються самі. Шари лежать позаду й зсунуті лише ліворуч, тож верх і низ рівні зі словом; відступ .135em ставить лівий край шарів рівно зі смугою диска */
.logo{display:inline-flex;align-items:baseline;padding-left:.135em}
h1 b{font-weight:inherit;-webkit-background-clip:text;background-clip:text;color:transparent}
.lugius{background-image:linear-gradient(180deg,#FFFFFF 0%,#E3EAF0 42%,#AEBBC6 68%,#75838F 100%)}
.lp{position:relative;isolation:isolate;display:inline-block}
.lp>b{background-image:linear-gradient(180deg,#4FA3FF 0%,#0D5FD6 100%)}
.stack{position:absolute;inset:0;z-index:-1}
.stack i{position:absolute;left:0;top:0;font-style:normal;-webkit-text-stroke:.05em var(--head);paint-order:stroke fill}
.stack i:nth-child(1){color:#FF9A1F;transform:translateX(-.165em)}
.stack i:nth-child(2){color:#9B5CFF;transform:translateX(-.11em)}
.stack i:nth-child(3){color:#FF5244;transform:translateX(-.055em)}
.stack i:nth-child(4){color:var(--head)}
.stats{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 40px;flex:1 1 420px}
.stat b{display:block;font:600 44px/1 var(--display);color:var(--head-ink)}
.stat span{font-size:12px;color:var(--head-mute)}
.stat.sig b{color:#CDA6FF}
.hr{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.hr a{display:flex;text-decoration:none}
.hr button{height:40px;background:transparent;color:var(--head-ink);border-color:var(--head-line)}
.hr button:hover{background:var(--head-line)}
.hr button.primary{background:#2BBF92;border-color:#2BBF92;color:#06211A;font-weight:600;padding:0 20px}
.hr button.primary:hover{background:#49D3A8;border-color:#49D3A8}
input[type=search],select,input[type=text],textarea{background:var(--panel);color:var(--ink);border:1px solid var(--strong);border-radius:8px;padding:7px 10px;font:inherit;transition:border-color .18s ease,box-shadow .18s ease}
input[type=search]{flex:1 1 300px;height:40px}
::placeholder{color:var(--mute);opacity:1}
input:focus,select:focus,textarea:focus,button:focus-visible,.chip:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button{background:var(--chip);color:var(--ink);border:1px solid var(--strong);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;transition:background-color .18s ease,border-color .18s ease,color .18s ease}
button:hover{background:var(--line)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
nav{position:relative;display:flex;align-items:center;gap:4px;margin:14px 28px 0;padding:6px;background:var(--card);border:1px solid var(--edge);border-radius:14px;box-shadow:0 1px 3px var(--cardshadow)}
nav a{padding:7px 14px;cursor:pointer;color:var(--mute);border-radius:9px;transition:color .18s ease,background-color .18s ease,box-shadow .18s ease}
nav a:hover{color:var(--bright)}
nav a.on{color:var(--bright);background:var(--inset);box-shadow:inset 0 0 0 1px var(--edge)}
#scanState{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;pointer-events:none}
#scanState .progress{width:220px;margin:4px auto 0}
@media(max-width:900px){#scanState{position:static;transform:none;margin-left:auto}}
main{padding:14px 28px 60px;margin:0 auto}
.bar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin-bottom:12px;color:var(--mute)}
.bar label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:99px;background:transparent;border:1px solid var(--strong);cursor:pointer;user-select:none;color:var(--blue);font:500 12.5px/1.4 var(--mono);transition:background-color .18s ease,color .18s ease,border-color .18s ease}
.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--blue);color:var(--bg);border-color:var(--blue)}
/* Кожен продукт окремий блок: заокруглює його перша й остання клітинка, а файли лежать усередині того самого блока */
.frame{overflow-x:auto;padding:0 2px 4px}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:10px 12px;text-align:left;vertical-align:middle;transition:background-color .2s ease,color .2s ease,border-color .2s ease,border-radius .24s ease}
td:first-child{padding-left:20px}
td:last-child{padding-right:20px}
th{padding-top:9px;padding-bottom:9px;font-weight:500;font-size:12px;color:var(--mute);background:var(--panel);border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--bright)}
th:first-child{width:30%;padding-left:20px;border-left:1px solid var(--edge);border-radius:14px 0 0 14px}
th:last-child{padding-right:20px;border-right:1px solid var(--edge);border-radius:0 14px 14px 0}
thead{filter:drop-shadow(0 1px 3px var(--cardshadow))}
tbody.prod{filter:drop-shadow(0 1px 3px var(--cardshadow))}
tbody.gap td{height:8px;padding:0}
tr.row{cursor:pointer}
tr.row td{background:var(--card);border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
tr.row td:first-child{border-left:1px solid var(--edge);border-radius:14px 0 0 14px}
tr.row td:last-child{border-right:1px solid var(--edge);border-radius:0 14px 14px 0}
tr.row:has(+ tr.file.open) td:first-child{border-bottom-left-radius:0}
tr.row:has(+ tr.file.open) td:last-child{border-bottom-right-radius:0}
tr.isnew td{background:var(--newcard);border-color:var(--newedge)}
tr.gone td{opacity:.72}
/* Плавна зміна при переході між рядками: кольори тексту теж перетікають */
.name,.sub,.tag,.lic,.tw,.szbar,.szbar i,td.num{transition:color .2s ease,background-color .2s ease,border-color .2s ease}
tr.row:hover td,tr.file.open:hover td{--ink:#0B1720;--bright:#0B1720;--mute:#2A3946;--blue:#0F4B91;--fmt:#AD1A24;--new:#5A14A0;--ok:#04603F;--warn:#6E4000;--bad:#A8000C;--bg:#FFFFFF;--chip:#FFFFFF;--strong:#2A3946;--track:#A9C8E2;--bar:#2A3946;--edge:#A9C8E2;
  background:var(--hover);color:var(--ink);border-color:var(--edge);opacity:1}
tr.row:hover .tag,tr.file:hover .tag,tr.row:hover [class*=lic-],tr.row:hover .k-new-file,tr.file:hover .k-new-file,tr.file:hover .k-removed{font-weight:600}
td.num{text-align:right;white-space:nowrap;font-family:var(--mono);font-size:13px}
td.sub{overflow-wrap:break-word;word-break:normal;min-width:150px}
td:last-child{min-width:170px}
/* Розгортання файлів: висота анімується через ґратку, бо висоту рядка таблиці анімувати не можна */
tr.file td{padding:0;background:var(--inset);font-size:13px}
tr.file td:first-child{border-left:1px solid var(--edge)}
tr.file td:last-child{border-right:1px solid var(--edge)}
tr.file:last-child td:first-child{border-bottom-left-radius:14px}
tr.file:last-child td:last-child{border-bottom-right-radius:14px}
/* Колір заданий і для згорнутого рядка: інакше рамка при розгортанні перетікає з кольору тексту й блимає */
tr.file:last-child td{border-bottom-color:var(--edge)}
tr.file.open:last-child td{border-bottom-style:solid;border-bottom-width:1px}
tr.file.isnew td{background:var(--newcard);border-color:var(--newedge)}
.fc{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;transition:grid-template-rows .24s ease,opacity .24s ease,visibility .24s}
.fc>div{overflow:hidden;min-height:0;padding:0 12px}
tr.file.open .fc{grid-template-rows:1fr;opacity:1;visibility:visible}
.fc>div>div{padding:6px 0}
tr.file td:first-child .fc>div{padding-left:42px}
tr.file td:last-child .fc>div{padding-right:20px}
.path{font-family:var(--mono);font-size:12px}
.name{font:600 30px/1.08 var(--display);letter-spacing:.01em;color:var(--bright);overflow-wrap:anywhere}
.name .tag{font:600 11.5px/1.4 var(--mono);letter-spacing:0;vertical-align:middle}
.sub{color:var(--mute);font-size:12.5px;overflow-wrap:anywhere}
.tag{display:inline-block;padding:0;font:500 12.5px/1.4 var(--mono);color:var(--fmt);margin-right:8px}
.tag.new{padding:1px 7px;border-radius:99px;background:var(--new);color:var(--bg);font-weight:600}
.tag.isnewfmt{color:var(--new);text-decoration:underline;text-underline-offset:3px}
.tag.foreign{padding:0 6px;border-radius:6px;border:1px solid var(--warn);color:var(--warn)}
.tag.stock{padding:0 6px;border-radius:6px;border:1px solid var(--mute);color:var(--mute)}
.newbar{color:var(--new);font-weight:600}
.newbar button{margin-left:8px;border-color:var(--new);color:var(--new);background:transparent}
.tw{background:none;border:0;padding:0;margin-right:6px;color:var(--mute);font:11px/1 var(--sans);display:inline-block;width:18px;text-align:center;vertical-align:middle;transition:transform .24s ease,color .2s ease}
.tw:hover{background:none;color:var(--bright)}
.tw.open{transform:rotate(90deg)}
.mini{padding:2px 9px;font-size:12px;white-space:nowrap}
.lic{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.lic i{flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
.szbar{display:block;height:5px;border-radius:3px;margin-top:5px;background:var(--track);min-width:96px;overflow:hidden}
.szbar i{display:block;height:5px;border-radius:3px;background:var(--bar)}
.disk{flex:1 0 100%;min-width:0}
.segs{display:flex;gap:2px;height:20px;border-radius:7px;overflow:hidden}
.segs span{min-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:9px;font-size:12.5px;color:var(--head-mute)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{flex:none;width:10px;height:10px;border-radius:50%}
.legend b{font-weight:500;color:var(--head-ink)}
tr.grp td{padding:14px 21px 8px}
tr.grp b{font:600 24px/1.1 var(--display);color:var(--blue);margin-right:12px}
.vendor{color:var(--blue);transition:color .2s ease}
.lic-file,.lic-manual{color:var(--ok)} .lic-hint{color:var(--new)} .lic-none{color:var(--mute)}
.empty{padding:48px;text-align:center;color:var(--mute);background:var(--panel);border:1px dashed var(--strong);border-radius:12px}
#drawer{position:fixed;top:8px;right:8px;width:520px;max-width:calc(100vw - 16px);height:calc(100vh - 16px);background:var(--bg);border:1px solid var(--edge);border-radius:14px;transform:translateX(calc(100% + 16px));transition:transform .26s cubic-bezier(.2,.8,.2,1),box-shadow .26s ease;z-index:10;overflow:auto;padding:18px 20px 40px}
#drawer.open{transform:none;box-shadow:-8px 0 30px var(--shadow)}
#drawer h2{margin:0 0 2px;font:600 38px/1.05 var(--display);color:var(--bright);overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px}
.kv div:nth-child(odd){color:var(--mute)}
.kv div{overflow-wrap:anywhere}
.field{margin:12px 0}
.field label{display:block;color:var(--mute);font-size:12.5px;margin-bottom:4px}
.field input,.field textarea{width:100%}
textarea{min-height:64px;resize:vertical}
.hint{color:var(--mute);font-size:12.5px;margin-top:3px}
.row-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.panel,.kv{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:14px 16px;margin:0 0 12px;box-shadow:0 1px 3px var(--cardshadow)}
.kv{margin-top:14px}
.panel h3{margin:0 0 8px;font:600 22px/1.1 var(--display);color:var(--bright)}
.fileitem{background:var(--inset);border-radius:10px;padding:10px 12px;margin-top:8px}
.fileitem code{background:var(--card)}
.fileitem .tag{font-weight:600}
.scan{border:1px solid var(--edge);border-radius:14px;background:var(--card);margin-bottom:12px;padding:12px 16px}
.k-new{color:var(--ok)} .k-new-file{color:var(--new)} .k-removed{color:var(--bad)} .k-updated{color:var(--warn)} .k-moved,.k-returned{color:var(--blue)}
.progress{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;width:40%;background:var(--steel);animation:slide 1.1s infinite ease-in-out}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:20;display:none}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font:12px var(--mono);overflow-wrap:anywhere}
#dClose{flex:none;align-self:flex-start;width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border-color:var(--strong);color:var(--bright)}
#dClose:hover{background:var(--hover);border-color:var(--hover);color:#0B1720}
.copy{cursor:pointer;color:var(--blue);margin-left:6px;font-size:12.5px}
@media(max-width:700px){h1{font-size:48px}.stat b{font-size:34px}header,main,nav{padding-left:16px;padding-right:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const I18N = JSON.parse($("#i18n").textContent);
function pickLang() {
  try { const v = localStorage.getItem("plugius.lang"); if (v in I18N) return v; } catch (e) {}
  // У застосунку оболонка передає мову macOS сама: navigator.language у WKWebView може від неї відрізнятись
  return /^uk\b/i.test(window.plugiusSystemLang || navigator.language || "") ? "uk" : "en";
}
const LANG = pickLang(), LOCALE = LANG === "en" ? "en-US" : "uk-UA";
const sub = (s, vars) => s.replace(/\{(\w+)\}/g, (m, k) => vars && k in vars ? vars[k] : m);
const t = (k, vars) => { const v = I18N[LANG][k]; return v == null ? k : sub(v, vars); };
// Те саме для HTML: шаблон екранується, вставки вже мають бути безпечним HTML
const th = (k, vars) => { const v = I18N[LANG][k]; return v == null ? esc(k) : sub(esc(v), vars); };
// Множина: українська має три форми, англійська дві
const tn = (k, n) => {
  const f = I18N[LANG][k], m = n % 100, u = n % 10;
  if (LANG === "en") return n + " " + f[n === 1 ? 0 : 1];
  return n + " " + f[m > 10 && m < 20 ? 2 : u === 1 ? 0 : u >= 2 && u <= 4 ? 1 : 2];
};
// Мова йде в кожен запит, щоб сервер перекладав свої фрази
const withLang = path => path + (path.includes("?") ? "&" : "?") + "lang=" + LANG;
function applyStatic() {
  document.documentElement.lang = LANG; document.title = t("app.title");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.title = t(el.dataset.i18nTitle));
  $("#csvLink").href = withLang("/api/export.csv");
}
applyStatic();

const S = {newOnly: false, all: [], sort: "name", dir: 1, q: "", fmt: new Set(), plat: "", vend: "", stock: false, nolic: false, gone: false, foreign: false, open: null, status: {}, expanded: new Set(), group: true};
try { S.group = localStorage.getItem("plugius.group") !== "0"; } catch (e) {}

async function api(path, opt) {
  const o = Object.assign({headers: {}}, opt || {});
  if (o.body && typeof o.body !== "string") { o.body = JSON.stringify(o.body); }
  if (o.body) o.headers["Content-Type"] = "application/json";
  const r = await fetch(withLang(path), o);
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok && !(j && "started" in j)) throw new Error((j && j.error) || r.statusText);
  return j;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 2800); }

function fmtSize(b) {
  if (!b) return "—";
  const u = t("units").split(" "); let i = 0, v = b;
  while (v >= 1024 && i < 3) { v /= 1024; i++; }
  return (i ? v.toFixed(v < 10 ? 1 : 0) : v) + " " + u[i];
}
function fmtDate(s) { if (!s) return "—"; const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString(LOCALE, {year:"numeric", month:"short", day:"numeric"}); }
function fmtDT(s) { if (!s) return "—"; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString(LOCALE, {dateStyle:"medium", timeStyle:"short"}); }
const nProducts = n => tn("pl.product", n);
const nFiles = n => tn("pl.file", n);
const uniq = a => [...new Set(a)];
// Файли продукту, які показує рядок: звичайно наявні, у режимі «Видалені» лише зниклі
const viewFiles = p => p.files.filter(f => S.gone ? !f.present : f.present);
const viewSize = p => viewFiles(p).reduce((s, f) => s + (f.size_bytes || 0), 0);
// Платформу сервер віддає мовою інтерфейсу
const isForeign = p => !!p.platform && p.platform !== "macOS" && !p.platform.startsWith(t("plat.universalPrefix"));

function licCell(p) {
  const cell = (cls, text, full) => `<span class="lic ${cls}" title="${esc(full || text)}"><i></i>${esc(text)}</span>`;
  if (p.license_manual) return cell("lic-manual", t("lic.manual"), p.license_manual);
  const auto = p.license_auto.filter(x => x.kind !== "guess"), guess = p.license_auto.find(x => x.kind === "guess");
  const shortOf = x => x.short || x.label;
  const f = auto.find(x => x.paths && x.paths.length), free = auto.find(x => x.kind === "free");
  if (f) return cell("lic-file", t("lic.file"), f.paths[0]);
  if (free) return cell("lic-file", shortOf(free), free.text);
  if (auto.length) return cell("lic-hint", shortOf(auto[0]), auto[0].text);
  if (guess) return cell("lic-hint", shortOf(guess), guess.paths[0]);
  return cell("lic-none", t("lic.none"));
}

function sourceShort(p) {
  if (p.source_manual) return p.source_manual.slice(0, 40);
  const s = p.source_auto || "";
  if (!s) return t("src.none");
  if (/^https?:/i.test(s)) { try { return new URL(s).hostname.replace(/^www\./, ""); } catch (e) {} }
  if (s.startsWith(t("src.probablyPrefix"))) return t("src.probably");
  if (s.startsWith(t("src.pkgPrefix"))) return t("src.pkg");
  return s.slice(0, 40);
}

function filtered() {
  const q = S.q.trim().toLowerCase();
  let rows = S.all.filter(p => {
    const vf = viewFiles(p);
    if (!vf.length) return false;
    if (!S.stock && p.stock) return false;
    if (S.fmt.size && !vf.some(f => S.fmt.has(f.format))) return false;
    if (S.plat && !vf.some(f => f.platform === S.plat)) return false;
    if (S.vend && p.vendor_eff !== S.vend) return false;
    if (S.nolic && p.license_state !== "none" && p.license_state !== "hint") return false;
    if (S.foreign && !vf.some(isForeign)) return false;
    if (q) {
      const hay = (p.name + " " + p.vendor_eff + " " + p.category + " " + p.source_eff + " " + p.description_eff + " " + p.notes + " " + p.au_components.join(" ") + " " +
        p.files.map(f => f.name + " " + f.path + " " + f.format).join(" ")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const k = S.sort, d = S.dir;
  const val = p => k === "vendor" ? p.vendor_eff.toLowerCase() : k === "size" ? viewSize(p) : k === "date" ? (p.installed_at || "") :
    k === "format" ? uniq(viewFiles(p).map(f => f.format)).join(",") : k === "source" ? p.source_eff.toLowerCase() : k === "lic" ? p.license_state : p.name.toLowerCase();
  rows.sort((a, b) => { if (a.is_new !== b.is_new) return b.is_new - a.is_new; const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * d; });
  if (!S.group) return rows;
  // Сортування діє і на групи: за назвою вони йдуть за абеткою, за розміром за сумою, інакше за першим плагіном групи.
  // Група з новим завжди нагорі
  const groups = new Map();
  rows.forEach(p => { const g = p.vendor_eff.toLowerCase(); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(p); });
  const sum = g => g.reduce((s, p) => s + viewSize(p), 0);
  const order = (a, b) => k === "name" || k === "vendor" ? a[0].localeCompare(b[0]) * d : k === "size" ? (sum(a[1]) - sum(b[1])) * d : 0;
  return [...groups.entries()].sort((a, b) => (b[1].some(p => p.is_new) - a[1].some(p => p.is_new)) || order(a, b)).flatMap(e => e[1]);
}

const migratedNote = `<div class="sub" title="${th("migrated.title")}">${th("migrated")}</div>`;

function newTag(p) {
  if (!p.new_count) return "";
  if (p.new_count === p.file_count) return ` <span class="tag new">${th("tag.new")}</span>`;
  return ` <span class="tag new" title="${th("tag.newFmt.title")}">${th("tag.newFmt", {f: esc(p.new_formats.join(", "))})}</span>`;
}

function formatTags(p) {
  const vf = viewFiles(p);
  const tags = uniq(vf.map(f => f.format)).map(fm => {
    const same = vf.filter(f => f.format === fm);
    return `<span class="tag ${p.new_formats.includes(fm) ? "isnewfmt" : ""}">${esc(fm)}${same.some(f => f.confidence === "low") ? "?" : ""}${same.length > 1 ? " ×" + same.length : ""}</span>`;
  }).join("");
  const foreign = uniq(vf.filter(isForeign).map(f => f.platform)).map(pl => `<span class="tag foreign" title="${th("tag.foreign.title")}">${esc(pl)}</span>`).join("");
  return tags + foreign;
}

// Як у сховищі iPhone: найбільші виробники кольорові, решта одним сірим сегментом. Плагінів можуть бути сотні, а виробників мало
const DISK_COLORS = ["#0A84FF", "#FF9F0A", "#BF5AF2", "#FF375F", "#64D2FF"], DISK_REST = "#8E8E93";

function diskStrip(rows) {
  const byVendor = new Map();
  rows.forEach(p => {
    const key = p.vendor_eff.toLowerCase(), v = byVendor.get(key) || {name: p.vendor_eff, size: 0};
    v.size += viewSize(p); byVendor.set(key, v);
  });
  const items = [...byVendor.values()].filter(x => x.size).sort((a, b) => b.size - a.size);
  const total = items.reduce((s, x) => s + x.size, 0);
  if (!total) return "";
  const pct = v => { const n = v / total * 100; return n < 1 ? t("disk.less1") : Math.round(n) + "%"; };
  const top = items.slice(0, DISK_COLORS.length).map((x, i) => Object.assign({color: DISK_COLORS[i], label: x.name}, x));
  const rest = items.slice(DISK_COLORS.length);
  if (rest.length) top.push({color: DISK_REST, label: t("disk.more", {n: tn("pl.vendor", rest.length)}), name: rest.map(x => x.name).join(", "), size: rest.reduce((s, x) => s + x.size, 0)});
  const segs = top.map(x => `<span title="${esc(x.name)} · ${fmtSize(x.size)} · ${pct(x.size)}" style="flex:${x.size} 1 0;background:${x.color}"></span>`).join("");
  const legend = top.map(x => `<span title="${esc(x.name)} · ${pct(x.size)}"><i style="background:${x.color}"></i>${esc(x.label)} <b>${fmtSize(x.size)}</b></span>`).join("");
  return `<div class="segs">${segs}</div><div class="legend">${legend}</div>`;
}

function productRow(p, maxSize) {
  const vf = viewFiles(p), many = p.files.length > 1, open = S.expanded.has(p.id), size = viewSize(p);
  const info = [nFiles(vf.length), p.category, p.versions.length ? "v" + p.versions.join(", ") : ""].filter(Boolean).join(" · ");
  const tw = many ? `<button class="tw ${open ? "open" : ""}" data-tw="${p.id}" aria-expanded="${open}" aria-label="${th(open ? "tw.collapse" : "tw.expand")}" title="${th("tw.title")}">▶</button>` : "";
  const guessed = !p.vendor_manual && p.vendor_src && p.vendor_src.includes(t("vendor.guessMark"));
  const vendor = S.group ? "" : `<td><span class="vendor">${esc(p.vendor_eff)}</span>${guessed ? '&nbsp;<span class="sub" title="' + th("vendor.guessed", {src: esc(p.vendor_src)}) + '">?</span>' : ""}</td>`;
  let html = `<tr class="row ${vf.length ? "" : "gone"} ${p.is_new ? "isnew" : ""}" data-id="${p.id}">
    <td><div class="name">${tw}${esc(p.name)}${newTag(p)}${p.stock ? ` <span class="tag stock">${th("tag.stock")}</span>` : ""}</div><div class="sub">${esc(info)}</div></td>
    ${vendor}
    <td style="white-space:nowrap">${formatTags(p)}</td>
    <td class="num">${fmtSize(size)}<span class="szbar"><i style="width:${Math.max(1.5, maxSize ? size / maxSize * 100 : 0).toFixed(1)}%"></i></span></td>
    <td style="white-space:nowrap">${fmtDate(p.installed_at)}${p.installed_flag === "migrated" ? migratedNote : ""}</td>
    <td class="sub" title="${esc(p.source_eff)}">${esc(sourceShort(p))}</td>
    <td>${licCell(p)}</td></tr>`;
  const fc = h => `<div class="fc"><div><div>${h}</div></div></div>`;
  if (many) html += p.files.map(f => `<tr class="file ${open ? "open" : ""} ${f.present ? "" : "gone"} ${f.is_new && f.present ? "isnew" : ""}" data-p="${p.id}">
    <td colspan="${S.group ? 1 : 2}">${fc(`<div class="sub path">${esc(f.path)}</div>${f.name !== p.name ? `<div class="sub">${th("file.label", {name: esc(f.name)})}</div>` : ""}`)}</td>
    <td>${fc(`<span class="tag ${f.is_new && f.present ? "isnewfmt" : ""}">${esc(f.format)}</span>${isForeign(f) ? `<span class="tag foreign">${esc(f.platform)}</span>` : ""}${f.present ? "" : `<div class="sub k-removed">${th("file.gone")}</div>`}${f.is_new && f.present ? `<div class="sub k-new-file">${th("file.new")}</div>` : ""}`)}</td>
    <td class="num">${fc(fmtSize(f.size_bytes))}</td>
    <td style="white-space:nowrap">${fc(fmtDate(f.installed_at) + (f.installed_flag === "migrated" ? migratedNote : ""))}</td>
    <td class="sub">${fc(f.version ? "v" + esc(f.version) : "—")}</td>
    <td>${fc(f.present ? `<button class="mini" data-reveal="${f.id}">${th("btn.finder")}</button>` : "")}</td></tr>`).join("");
  return html;
}

function tableBody(rows) {
  const maxSize = Math.max(0, ...rows.map(viewSize));
  let last = null;
  return rows.map(p => {
    let head = "";
    if (S.group && p.vendor_eff.toLowerCase() !== last) {
      last = p.vendor_eff.toLowerCase();
      const same = rows.filter(x => x.vendor_eff.toLowerCase() === last);
      head = `<tbody><tr class="grp"><td colspan="6"><b>${esc(p.vendor_eff)}</b><span class="sub">${esc(nProducts(same.length))} · ${fmtSize(same.reduce((s, x) => s + viewSize(x), 0))}</span></td></tr></tbody>`;
    }
    return head + `<tbody class="prod">${productRow(p, maxSize)}</tbody><tbody class="gap"><tr><td colspan="${S.group ? 6 : 7}"></td></tr></tbody>`;
  }).join("");
}

function render() {
  const rows = filtered();
  const visible = S.all.filter(p => p.present && (S.stock || !p.stock));
  const fmts = {};
  visible.forEach(p => uniq(p.files.filter(f => f.present).map(f => f.format)).forEach(f => fmts[f] = (fmts[f] || 0) + 1));
  $("#fmtChips").innerHTML = Object.keys(fmts).sort().map(f => `<span class="chip ${S.fmt.has(f) ? "on" : ""}" data-f="${esc(f)}" title="${th("chip.title", {n: esc(nProducts(fmts[f])), f: esc(f)})}">${esc(f)} · ${fmts[f]}</span>`).join("");
  $("#fmtLabel").style.display = Object.keys(fmts).length ? "" : "none";
  const plats = uniq(S.all.flatMap(p => p.files.map(f => f.platform)).filter(Boolean)).sort();
  fill($("#platSel"), plats, S.plat, t("plat.all"));
  const vends = uniq(S.all.filter(p => S.stock || !p.stock).map(p => p.vendor_eff)).sort((a, b) => a.localeCompare(b));
  fill($("#vendSel"), vends, S.vend, t("vend.all"));
  const newp = visible.filter(p => p.is_new), nNew = newp.reduce((s, p) => s + p.new_count, 0);
  $("#newBar").innerHTML = newp.length ? `${th("newbar", {p: esc(nProducts(newp.length)), f: esc(nFiles(nNew))})} <button id="ackNew">${th("newbar.ack")}</button>` : "";
  const nf = rows.reduce((s, p) => s + viewFiles(p).length, 0), total = rows.reduce((s, p) => s + viewSize(p), 0);
  const stat = (t, sig) => { const i = t.indexOf(" "); return `<div class="stat ${sig ? "sig" : ""}"><b>${esc(t.slice(0, i))}</b><span>${esc(t.slice(i + 1))}</span></div>`; };
  const nCheck = rows.filter(p => p.license_state === "hint" || p.license_state === "none").length;
  $("#stats").innerHTML = stat(nProducts(rows.length)) + stat(nFiles(nf)) + (total ? `<div class="stat"><b>${fmtSize(total)}</b><span>${th("stat.disk")}</span></div>` : "") + `<div class="stat ${nCheck ? "sig" : ""}"><b>${nCheck}</b><span>${th("stat.check")}</span></div>`;
  $("#disk").innerHTML = diskStrip(rows);
  const hiddenStock = S.all.filter(p => p.present && p.stock).length;
  if (!S.all.length) {
    $("#tableWrap").innerHTML = `<div class="empty">${th("empty.catalog")}</div>`;
    return;
  }
  if (!rows.length) { $("#tableWrap").innerHTML = `<div class="empty">${th("empty.filter")}${hiddenStock && !S.stock ? th("empty.hiddenStock", {n: hiddenStock}) : ""}</div>`; return; }
  const hd = (k, label, cls) => `<th data-s="${k}" class="${cls||""}">${th(label)}${S.sort === k ? (S.dir > 0 ? " ▲" : " ▼") : ""}</th>`;
  $("#tableWrap").innerHTML = `<div class="frame"><table><thead><tr>${hd("name","th.name")}${S.group ? "" : hd("vendor","th.vendor")}${hd("format","th.format")}${hd("size","th.size","num")}${hd("date","th.date")}${hd("source","th.source")}${hd("lic","th.lic")}</tr></thead><tbody class="gap"><tr><td colspan="${S.group ? 6 : 7}"></td></tr></tbody>` +
    tableBody(rows) + `</table></div>`;
}
function fill(sel, vals, cur, all) {
  const h = `<option value="">${esc(all)}</option>` + vals.map(v => `<option ${v === cur ? "selected" : ""} value="${esc(v)}">${esc(v)}</option>`).join("");
  if (sel.innerHTML !== h) sel.innerHTML = h;
}

const fileById = id => { for (const p of S.all) { const f = p.files.find(x => x.id === id); if (f) return f; } return null; };
function clearNew(p) { p.is_new = 0; p.new_count = 0; p.new_formats = []; p.files.forEach(f => f.is_new = 0); }

function fileItem(f) {
  return `<div class="fileitem"><span class="tag">${esc(f.format)}</span>${f.version ? `<span class="sub">v${esc(f.version)} · </span>` : ""}<span class="sub">${fmtSize(f.size_bytes)}${f.platform ? " · " + esc(f.platform) : ""}${f.arch ? " · " + esc(f.arch) : ""}</span>${f.present ? "" : ` <span class="k-removed">${th("file.gone")}</span>`}${f.stock ? ` <span class="tag stock">${th("tag.stock")}</span>` : ""}
    <div style="margin-top:4px"><code>${esc(f.path)}</code> <span class="copy" data-copy="${f.id}">${th("fi.copy")}</span>${f.present ? ` <button class="mini" data-reveal="${f.id}">${th("btn.finder")}</button>` : ""}</div>
    <div class="sub">${th("fi.installed", {d: esc(fmtDT(f.installed_at)), src: esc(f.installed_src || "")})}${f.installed_flag === "migrated" ? " · " + th("migrated") : ""}</div>
    <div class="sub">${th("fi.created", {c: esc(fmtDT(f.file_created_at)), s: esc(fmtDT(f.last_seen))})}</div>
    ${f.source_auto ? `<div class="sub">${th("fi.source", {s: esc(f.source_auto)})}</div>` : ""}
    ${f.bundle_id ? `<div class="sub">${th("fi.bundle", {id: "<code>" + esc(f.bundle_id) + "</code>"})}</div>` : ""}
    ${f.pkg_id ? `<div class="sub">${th("fi.pkg", {id: "<code>" + esc(f.pkg_id) + "</code>"})}</div>` : ""}</div>`;
}

function openDrawer(id, keepScroll) {
  const p = S.all.find(x => x.id === id); if (!p) return;
  S.open = id;
  if (p.is_new) { clearNew(p); api("/api/products/" + id, {method: "PATCH", body: {is_new: 0}}).catch(() => {}); setTimeout(render, 0); }
  const many = p.files.length > 1;
  const mix = k => p.manual_mixed.includes(k) ? `<div class="hint">${th("dr.mixed")}</div>` : "";
  const lic = p.license_auto.map(x => `<div style="margin-bottom:8px"><b>${esc(x.label)}</b><div class="sub">${esc(x.text)}</div>` +
    (x.paths || []).map(pp => `<div class="sub"><code>${esc(pp)}</code></div>`).join("") + `</div>`).join("") || `<div class="sub">${th("dr.licNone")}</div>`;
  const setup = S.status.mac_setup_at ? " (" + fmtDate(S.status.mac_setup_at) + ")" : "";
  $("#drawer").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:8px"><div><h2>${esc(p.name)}</h2><div class="sub"><span class="vendor">${esc(p.vendor_eff)}</span> · ${esc(p.formats.join(", "))}${p.versions.length ? " · v" + esc(p.versions.join(", ")) : ""}</div></div><button id="dClose" aria-label="${th("dr.close")}" title="${th("dr.close")}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></button></div>
    <div class="kv">
      <div>${th("dr.size")}</div><div>${fmtSize(p.size_bytes)}${many ? " · " + nFiles(p.file_count) : ""}</div>
      <div>${th("dr.platform")}</div><div>${esc(p.platforms.join(", ") || "—")}</div>
      <div>${th("dr.category")}</div><div>${esc(p.category || "—")}</div>
      ${p.au_components.length > 1 ? `<div>${th("dr.components")}</div><div>${esc(p.au_components.join(", "))}</div>` : ""}
      <div>${th("dr.installed")}</div><div>${fmtDT(p.installed_at)} <span class="sub">(${esc(p.installed_src || "")})</span>${p.installed_flag === "migrated" ? `<div class="k-updated">${th("dr.migrated", {setup: esc(setup)})}</div>` : ""}</div>
      <div>${th("dr.firstSeen")}</div><div>${fmtDT(p.first_seen)}</div>
      ${p.stock ? `<div>${th("dr.whyStock")}</div><div>${esc(p.stock_reason || t("dr.stockManual"))}</div>` : ""}
    </div>
    <div class="panel"><h3>${th(many ? "dr.files" : "dr.file")}</h3>${p.files.map(fileItem).join("")}</div>
    <div class="panel"><h3>${th("dr.licAuto")}</h3>${lic}</div>
    <div class="panel"><h3>${th("dr.manual")}</h3>${many ? `<div class="hint">${th("dr.shared")}</div>` : ""}
    <div class="field"><label>${th("dr.vendor")}</label><input type="text" id="fVendor" value="${esc(p.vendor_manual)}" placeholder="${esc(p.vendor || "")}">${mix("vendor_manual")}</div>
    <div class="field"><label>${th("dr.source")}</label><input type="text" id="fSource" value="${esc(p.source_manual)}" placeholder="${esc(p.source_auto || t("dr.source.ph"))}"><div class="hint">${th("dr.auto", {v: esc(p.source_auto || t("dr.notDetected"))})}</div>${mix("source_manual")}</div>
    <div class="field"><label>${th("dr.lic")}</label><textarea id="fLic" placeholder="${th("dr.lic.ph")}">${esc(p.license_manual)}</textarea>${mix("license_manual")}</div>
    <div class="field"><label>${th("dr.desc")}</label><textarea id="fDesc" placeholder="${esc(p.description_auto)}">${esc(p.description_manual)}</textarea><div class="hint">${th("dr.auto", {v: esc(p.description_auto)})}</div>${mix("description_manual")}</div>
    <div class="field"><label>${th("dr.notes")}</label><textarea id="fNotes">${esc(p.notes)}</textarea>${mix("notes")}</div>
    <div class="field"><label>${th("dr.stockQ")}</label><select id="fStockSel"><option value="">${th("dr.stockAuto", {v: th(p.is_stock ? "dr.isStock" : "dr.notStock")})}</option><option value="1">${th("dr.stockYes")}</option><option value="0">${th("dr.stockNo")}</option></select></div>
    </div>
    <div class="row-actions"><button class="primary" id="dSave">${th("dr.save")}</button></div>`;
  const stockNow = p.stock_override === null || p.stock_override === undefined ? "" : String(p.stock_override);
  $("#fStockSel").value = stockNow;
  if (!keepScroll) $("#drawer").scrollTop = 0;
  $("#drawer").classList.add("open"); $("#drawer").setAttribute("aria-hidden", "false");
  $("#dClose").onclick = closeDrawer;
  $("#dSave").onclick = async () => {
    // Надсилаємо лише змінене: незачеплені поля файлів лишаються такими, як були
    const body = {};
    for (const [el, k] of [["#fVendor","vendor_manual"],["#fSource","source_manual"],["#fLic","license_manual"],["#fDesc","description_manual"],["#fNotes","notes"]])
      if ($(el).value !== (p[k] || "")) body[k] = $(el).value;
    const so = $("#fStockSel").value;
    if (so !== stockNow) body.stock_override = so === "" ? null : Number(so);
    if (!Object.keys(body).length) return toast(t("toast.noChanges"));
    try {
      const fid = p.files[0].id, top = $("#drawer").scrollTop;
      await api("/api/products/" + p.id, {method: "PATCH", body});
      await loadPlugins();
      // Після зміни виробника продукт може об'єднатись з іншим, тому шукаємо його за файлом
      const now = S.all.find(x => x.files.some(f => f.id === fid));
      if (now && S.open === id) { openDrawer(now.id, true); $("#drawer").scrollTop = top; }
      toast(t("toast.saved"));
    } catch (e) { toast(t("toast.error", {e: e.message})); }
  };
}
function closeDrawer() { S.open = null; $("#drawer").classList.remove("open"); $("#drawer").setAttribute("aria-hidden", "true"); }

async function loadPlugins() { S.all = await api("/api/products"); render(); }

async function refreshStatus(first) {
  const st = await api("/api/status"); const was = S.status.running; S.status = st;
  $("#btnScan").style.display = st.running ? "none" : ""; $("#btnCancel").style.display = st.running ? "" : "none";
  const ss = $("#scanState");
  if (st.running) {
    ss.innerHTML = `${esc(st.phase)}: ${st.phase === t("phase.search") ? esc(tn("pl.folder", st.dirs)) : st.analyzed + " / " + st.candidates} · ${th("st.found", {n: st.found})}<div class="progress"><i></i></div>`;
  } else if (st.error) ss.textContent = t("toast.error", {e: st.error});
  else ss.textContent = st.last_scan_at ? t("st.last", {d: fmtDT(st.last_scan_at)}) : t("st.never");
  if (was && !st.running) { await loadPlugins(); toast(st.last_result ? t("st.done", {n: st.last_result.new, u: st.last_result.updated, r: st.last_result.removed}) : t("st.doneShort")); if (tab === "history") renderHistory(); }
  if (first && !was && st.running) {}
  return st;
}

async function renderHistory() {
  const h = await api("/api/history"), word = (k, raw) => I18N[LANG][k] || raw;
  $("#tab-history").innerHTML = h.length ? h.map(s => `<div class="scan"><b>${fmtDT(s.started_at)}</b> <span class="sub">· ${th(s.mode === "full" ? "h.full" : "h.standard")} · ${esc(word("trigger." + s.trigger, s.trigger))} · ${th("st.found", {n: s.found})}</span>
    <div class="sub">${th("h.counts", {n: s.new_count, u: s.updated_count, r: s.removed_count})}</div>
    ${s.changes.map(c => `<div class="k-${c.kind}">${esc(word("kind." + c.kind, c.kind))}: <b>${esc(c.name)}</b> <span class="sub">${esc(c.detail)}</span></div>`).join("")}
    ${s.errors ? `<details><summary class="sub">${th("h.warnings", {n: s.errors.split("\n").length})}</summary><pre class="sub">${esc(s.errors)}</pre></details>` : ""}</div>`).join("") : `<div class="empty">${th("h.empty")}</div>`;
}

async function renderSettings() {
  const st = await api("/api/status"); const sc = st.schedule;
  const radio = (name, value, on, label) => `<label style="display:block;margin:6px 0"><input type="radio" name="${name}" value="${value}" ${on ? "checked" : ""}> ${label}</label>`;
  $("#tab-settings").innerHTML = `
  <div class="panel"><h3>${th("set.lang")}</h3>
    ${radio("lang", "uk", LANG === "uk", th("lang.uk"))}${radio("lang", "en", LANG === "en", th("lang.en"))}
    <div class="hint">${th("set.lang.hint")}</div></div>
  <div class="panel"><h3>${th("set.what")}</h3>
    ${radio("mode", "standard", st.scan_mode === "standard", th("set.standard"))}${radio("mode", "full", st.scan_mode === "full", th("set.full"))}
    <div class="hint">${th("set.modeHint")}</div></div>
  <div class="panel"><h3>${th("set.weekly")}</h3>
    ${sc.supported ? `<div>${th("set.status")} <b>${th(sc.installed ? (sc.loaded ? "set.on" : "set.notLoaded") : "set.off")}</b> <span class="sub">${th("set.when")}</span></div>
      <div class="row-actions"><button id="schOn" class="primary">${th(sc.installed ? "set.reinstall" : "set.enable")}</button>${sc.installed ? `<button id="schOff">${th("set.disable")}</button>` : ""}</div>
      <div class="hint">${th("set.fda")}</div>`
      : `<div class="sub">${th("set.macOnly")}</div>`}</div>
  <div class="panel"><h3>${th("set.rules")}</h3>
    <div class="sub">${th("set.dataDir", {d: "<code>" + esc(st.home) + "</code>"})}</div>
    <div class="sub">${th("set.rulesText", {a: "<code>stock_rules.json</code>", b: "<code>license_rules.json</code>", c: "<code>vendor_rules.json</code>"})}</div>
    <div class="sub">${th("set.version", {v: esc(st.version)})}</div>
    ${/PlugiusApp/.test(navigator.userAgent) ? "" : `<div class="row-actions"><button id="quit">${th("set.quit")}</button></div>`}</div>`;
  // Нова мова потрібна і серверу, і всім уже показаним текстам, тож простіше перезавантажити сторінку
  document.querySelectorAll('input[name=lang]').forEach(r => r.onchange = () => { try { localStorage.setItem("plugius.lang", r.value); } catch (e) {} location.reload(); });
  document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = async () => { await api("/api/settings", {method: "POST", body: {scan_mode: r.value}}); toast(t("toast.saved")); });
  const on = $("#schOn"), off = $("#schOff");
  if (on) on.onclick = async () => { try { await api("/api/schedule", {method: "POST", body: {enable: true}}); toast(t("toast.schedOn")); renderSettings(); } catch (e) { alert(e.message); renderSettings(); } };
  if (off) off.onclick = async () => { await api("/api/schedule", {method: "POST", body: {enable: false}}); toast(t("toast.schedOff")); renderSettings(); };
  if ($("#quit")) $("#quit").onclick = async () => { if (confirm(t("quit.confirm"))) { try { await api("/api/quit", {method: "POST", body: {}}); } catch (e) {} document.body.innerHTML = `<div class="empty" style="margin:40px">${th("quit.done")}</div>`; } };
}

let tab = "plugins";
function showTab(t) {
  tab = t; closeDrawer();
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.tab === t));
  for (const n of ["plugins", "history", "settings"]) $("#tab-" + n).style.display = n === t ? "" : "none";
  if (t === "history") renderHistory(); if (t === "settings") renderSettings();
}

document.addEventListener("click", e => {
  const a = e.target.closest("nav a"); if (a) return showTab(a.dataset.tab);
  const c = e.target.closest(".chip"); if (c) { const f = c.dataset.f; S.fmt.has(f) ? S.fmt.delete(f) : S.fmt.add(f); return render(); }
  const hc = e.target.closest("th[data-s]"); if (hc) { const k = hc.dataset.s; if (S.sort === k) S.dir *= -1; else { S.sort = k; S.dir = 1; } return render(); }
  if (e.target.closest("#ackNew")) { api("/api/ack-new", {method: "POST", body: {}}).then(() => { S.all.forEach(clearNew); render(); }); return; }
  const tw = e.target.closest("[data-tw]"); if (tw) {
    // Без перемальовування таблиці: інакше анімація не спрацює
    const id = Number(tw.dataset.tw), open = !S.expanded.has(id);
    open ? S.expanded.add(id) : S.expanded.delete(id);
    tw.classList.toggle("open", open); tw.setAttribute("aria-expanded", open); tw.setAttribute("aria-label", t(open ? "tw.collapse" : "tw.expand"));
    document.querySelectorAll(`tr.file[data-p="${id}"]`).forEach(r => r.classList.toggle("open", open));
    return;
  }
  const rv = e.target.closest("[data-reveal]"); if (rv) { api("/api/reveal", {method: "POST", body: {id: Number(rv.dataset.reveal)}}).catch(ex => toast(ex.message)); return; }
  const cp = e.target.closest("[data-copy]"); if (cp) { const f = fileById(Number(cp.dataset.copy)); if (f && navigator.clipboard) navigator.clipboard.writeText(f.path); toast(t("toast.copied")); return; }
  const r = e.target.closest("tr.row");
  if (r) { const id = Number(r.dataset.id); return S.open === id ? closeDrawer() : openDrawer(id); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
$("#q").oninput = e => { S.q = e.target.value; render(); };
$("#platSel").onchange = e => { S.plat = e.target.value; render(); };
$("#vendSel").onchange = e => { S.vend = e.target.value; render(); };
for (const [id, k] of [["fStock","stock"],["fNoLic","nolic"],["fGone","gone"],["fForeign","foreign"]]) $("#" + id).onchange = e => { S[k] = e.target.checked; render(); };
$("#fGroup").checked = S.group;
$("#fGroup").onchange = e => { S.group = e.target.checked; try { localStorage.setItem("plugius.group", S.group ? "1" : "0"); } catch (ex) {} render(); };
$("#btnScan").onclick = async () => { try { await api("/api/scan", {method: "POST", body: {}}); } catch (e) { toast(e.message); } refreshStatus(); };
$("#btnCancel").onclick = () => api("/api/scan/cancel", {method: "POST", body: {}});

(async function init() {
  await loadPlugins(); await refreshStatus(true);
  setInterval(() => refreshStatus().catch(() => {}), 1200);
})().catch(e => { document.body.insertAdjacentHTML("afterbegin", `<div class="empty">${th("err.connect", {e: esc(e.message)})}</div>`); });
</script>
</body>
</html>
